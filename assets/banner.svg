<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatMedium {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
      }

      .pulse-1 { animation: pulseGlow 7s ease-in-out infinite; transform-origin: 200px 100px; }
      .pulse-2 { animation: pulseGlow 9s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
      .float-1 { animation: floatSlow 5s ease-in-out infinite; }
      .float-2 { animation: floatMedium 6s ease-in-out infinite 1s; }
      .float-3 { animation: floatSlow 5.5s ease-in-out infinite 2.5s; }
      .dash-flow { stroke-dasharray: 6 6; animation: dashMove 4s linear infinite; }
      .badge-glow { animation: badgePulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.8">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulse-1" cx="220" cy="110" r="140" fill="url(#glowGrad1)" filter="url(#softGlow)" />
  <circle class="pulse-2" cx="980" cy="290" r="160" fill="url(#glowGrad2)" filter="url(#softGlow)" />

  <!-- Background Dynamic Knowledge Graph Network (Behind text) -->
  <g opacity="0.38">
    <!-- Graph Connections Left -->
    <path class="dash-flow" d="M 80 120 L 160 70 L 240 130 L 190 220 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line class="dash-flow" x1="160" y1="70" x2="190" y2="220" stroke="#818cf8" stroke-width="1.2" />
    <line class="dash-flow" x1="80" y1="120" x2="120" y2="270" stroke="#38bdf8" stroke-width="1.2" />
    <line class="dash-flow" x1="120" y1="270" x2="190" y2="220" stroke="#c084fc" stroke-width="1.2" />

    <!-- Graph Connections Right -->
    <path class="dash-flow" d="M 960 120 L 1050 60 L 1120 140 L 1040 240 Z" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <line class="dash-flow" x1="1050" y1="60" x2="1040" y2="240" stroke="#f472b6" stroke-width="1.2" />
    <line class="dash-flow" x1="1120" y1="140" x2="1090" y2="290" stroke="#818cf8" stroke-width="1.2" />
    <line class="dash-flow" x1="1040" y1="240" x2="1090" y2="290" stroke="#38bdf8" stroke-width="1.2" />

    <!-- Graph Nodes (Circles) -->
    <g class="float-1">
      <circle cx="80" cy="120" r="6" fill="#38bdf8" filter="url(#nodeGlow)" />
      <circle cx="160" cy="70" r="8" fill="#818cf8" filter="url(#nodeGlow)" />
      <circle cx="240" cy="130" r="6" fill="#c084fc" />
      <circle cx="190" cy="220" r="9" fill="#38bdf8" filter="url(#nodeGlow)" />
      <circle cx="120" cy="270" r="5" fill="#818cf8" />
    </g>

    <g class="float-2">
      <circle cx="960" cy="120" r="7" fill="#818cf8" />
      <circle cx="1050" cy="60" r="9" fill="#c084fc" filter="url(#nodeGlow)" />
      <circle cx="1120" cy="140" r="6" fill="#f472b6" />
      <circle cx="1040" cy="240" r="8" fill="#38bdf8" filter="url(#nodeGlow)" />
      <circle cx="1090" cy="290" r="6" fill="#c084fc" />
    </g>
  </g>

  <!-- Side Floating Feature Badges (Deep Background, Flanking Edges) -->
  <g class="float-1" transform="translate(60, 45)">
    <rect width="115" height="28" rx="14" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="57" y="18" fill="#93c5fd" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">⚡ LOCAL-FIRST</text>
  </g>

  <g class="float-3" transform="translate(70, 315)">
    <rect width="125" height="28" rx="14" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="62" y="18" fill="#c7d2fe" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">🔒 E2EE ENCRYPTED</text>
  </g>

  <g class="float-2" transform="translate(1010, 45)">
    <rect width="125" height="28" rx="14" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <text x="62" y="18" fill="#e9d5ff" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">🧠 SECOND BRAIN</text>
  </g>

  <g class="float-1" transform="translate(1000, 315)">
    <rect width="135" height="28" rx="14" fill="url(#pillGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4" />
    <text x="67" y="18" fill="#fbcfe8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">🕸️ KNOWLEDGE GRAPH</text>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT ================= -->

  <!-- Eyebrow Pill -->
  <g class="badge-glow" transform="translate(435, 62)">
    <rect width="330" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="15" r="4.5" fill="#38bdf8" />
    <text x="175" y="20" fill="#e2e8f0" font-size="12" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="600" letter-spacing="1.2" text-anchor="middle">CURATED DIRECTORY &amp; BENCHMARK</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <text fill="url(#titleGrad)" font-size="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
      AWESOME NOTE-TAKING
    </text>
    <text y="48" fill="#ffffff" font-size="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="700" letter-spacing="0.2" text-anchor="middle">
      &amp; ORGANIZATION TOOLS
    </text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="248" fill="#94a3b8" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.2" text-anchor="middle">
    Top SaaS &amp; Open-Source PKM, Digital Gardens, Outliners, Zettelkasten &amp; Encrypted Sync Engines
  </text>

  <!-- Bottom Interactive Tags Bar -->
  <g transform="translate(230, 290)">
    <!-- Pill 1: Markdown-Native -->
    <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="65" y="21" fill="#38bdf8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">📝 Markdown</text>

    <!-- Pill 2: Bidirectional Links -->
    <rect x="145" y="0" width="145" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="217" y="21" fill="#818cf8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">🔗 Backlinks &amp; PKM</text>

    <!-- Pill 3: Local-First Storage -->
    <rect x="305" y="0" width="140" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="375" y="21" fill="#c084fc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">📂 Local-First Data</text>

    <!-- Pill 4: Zero-Knowledge E2EE -->
    <rect x="460" y="0" width="135" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="527" y="21" fill="#f472b6" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">🔐 Zero-Trust E2EE</text>

    <!-- Pill 5: Self-Hostable -->
    <rect x="610" y="0" width="130" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="675" y="21" fill="#34d399" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">🐳 Self-Hosted</text>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1.5" y="1.5" width="1197" height="397" rx="15" fill="none" stroke="url(#titleGrad)" stroke-width="1.2" stroke-opacity="0.4" />
</svg>
